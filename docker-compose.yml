services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: datapulse
      POSTGRES_USER: datapulse
      POSTGRES_PASSWORD: datapulse_local
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapulse"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://datapulse:datapulse_local@db:5432/datapulse
      IMPORT_API_KEY: ${IMPORT_API_KEY:?Configure IMPORT_API_KEY in .env}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  dashboard:
    build: .
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      API_URL: http://api:8000
      IMPORT_API_KEY: ${IMPORT_API_KEY:?Configure IMPORT_API_KEY in .env}
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  data:
